name: Deploy na DockerHub

# Ta workflow se ne sproži ob pushu, ampak ko se zaključi prvi workflow (Testiranje kode)
on:
  workflow_run:
    workflows: ["Testiranje kode"]
    types: [completed]

jobs:
  objava_na_dockerhub:
    runs-on: self-hosted
    # ZAHTEVA NALOGE: Skripta se zažene le, če je prejšnja (testiranje) uspešno zaključena
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Prenos kode iz repozitorija
        uses: actions/checkout@v4

      - name: Prijava v DockerHub
        # Uporabimo uradno akcijo in tvoje shranjene skrivnosti (Secrets)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Priprava Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Izgradnja slike in potisk na DockerHub
        # Ta korak prebere tvoj Dockerfile, zgradi sliko in jo pošlje v tvoj repozitorij
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Uporabimo tvoje uporabniško ime iz secrets in ime repozitorija 'vaja_2_algoritmi'
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/vaja_2_algoritmi:latest
