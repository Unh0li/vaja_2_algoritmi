name: Testiranje kode

on:
  push:
    branches: [ "main" ]

jobs:
  preveri_skripte:
    runs-on: self-hosted
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Preveri obstoj mape tests
        # Preusmerimo napako v datoteko, kot zahteva naloga
        run: ls tests/ 2> napaka.txt || (echo "Mapa tests ne obstaja" > napaka.txt)

      - name: Shrani artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-napake
          path: napaka.txt

  izvedi_teste:
    needs: preveri_skripte
    runs-on: self-hosted
    strategy:
      matrix:
        python-version: ["3.10", "3.12"] # Uporaba matrike

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Prenos artefakta
        uses: actions/download-artifact@v4
        with:
          name: log-napake

      - name: Preveri vsebino napake
        run: |
          if [ -s napaka.txt ]; then
            echo "Napaka pri preverjanju testov!"
            cat napaka.txt
            exit 1
          fi

      - name: Nastavitev Pythona ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Namestitev pytest
        run: pip install pytest

      - name: Zagon testov
        run: pytest tests/
