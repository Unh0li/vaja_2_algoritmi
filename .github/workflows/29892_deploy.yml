name: Deploy na DockerHub

# ne sprozi se ob pushu ampak ko se konca prvi workflow
on:
  workflow_run:
    workflows: ["Testiranje kode"]
    types: [completed]

jobs:
  objava_na_dockerhub:
    runs-on: self-hosted
    # zazene le ce je testiranje uspesno
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Prenos kode iz repozitorija
        uses: actions/checkout@v4

      - name: Prijava v DockerHub
        # uporabimo uradno akcijo in shranjene skrivnosti 
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Priprava Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Izgradnja slike in potisk na DockerHub
        # prebere Dockerfile, zgradi sliko in jo poslje v repozitorij
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Uporabimo uporabnisko ime iz secrets in ime repozitorija 'vaja_2_algoritmi'
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/vaja_2_algoritmi:latest
